public_knowledge_time: "Najpóźniejsze wykorzystane źródła przed sesjami: UPI 22 kwietnia 1982 (werdykt FISA z poniedziałku o unieważnieniu 1–2 Piqueta/Rosberga w Rio; oświadczenie bojkotu FOCA z czwartku; zapewnienia organizatorów); Motor Sport June 1982 i Autosport Grand Prix Gold (pasaże o paddocku, obsadzie, godzinie pierwszej sesji i charakterystyce toru — izolowane od wyników sesji/wyścigu; publication_date dnia unknown; content-based availability); marcowy Motor Sport (plan BT50–BMW na Imolę)"
knowledge_cutoff: "Immediately before the first official session of the 1982 San Marino Grand Prix weekend at Autodromo Dino Ferrari, Imola (race day Sunday 25 April 1982). Best available marker for that session start: Friday 23 April 1982 morning official testing at the scheduled time of about 10:00 local as reported in Motor Sport June 1982; exact official programme clock not independently verified. After the Long Beach immediate official process (through Monday 5 April 1982 Villeneuve DSQ) and after the FISA Appeals Tribunal Brazil ruling (Monday circa 19 April 1982) and Thursday 22 April 1982 FOCA boycott statement; before any official practice, qualifying, grid, or race result from Imola."
