public_knowledge_time: "Najpóźniejsze wykorzystane informacje: niedzielna rozgrzewka, oddalenie protestu Tyrrella o turbosprężarki oraz warunki pogodowe przed planowanym startem ≈15:01 lokalnie 25 kwietnia 1982 — według relacji Motor Sport June 1982 i Autosport Grand Prix Gold (pasaże przedstartowe; publication_date dnia unknown dla reprintu Autosportu; content-based availability); czasy 5.–14. z rekonstrukcji Racing Sports Cars"
knowledge_cutoff: "Immediately before the scheduled race start of the 1982 San Marino Grand Prix at Autodromo Dino Ferrari, Imola, Sunday 25 April 1982. Best available start marker: approximately 15:01 local time (Italian afternoon; DST typically in force) as reported in Motor Sport June 1982 (“one minute after 3 p.m.” for television); exact official programme clock and named time zone not independently verified. Includes completed Friday–Saturday practice/qualifying, Sunday morning warm-up, confirmed grid, Tyrrell turbo protest and stewards’ rejection before the start, and pre-start weather/tyre notes. Does not include the green-light start, formation/parade-lap incidents after cars leave for the parade, race events or results, post-race scrutineering/DSQs, later appeals, or any Pironi–Villeneuve race controversy."
