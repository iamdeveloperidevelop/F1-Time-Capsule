cutoffs:
  pre_weekend: "Immediately before the first official session of the 1982 United States Grand Prix West weekend on the Long Beach street circuit, California (race day Sunday 4 April 1982). Best available marker: Friday 2 April 1982 morning official test session around 10:00 local time as reported in Motor Sport May 1982; exact official programme clock not independently verified. After the Brazilian GP of 21 March 1982 and the open ASN appeal path on the water/weight protest; before any official practice, qualifying, grid, or race result from Long Beach. Does not include the later FISA Appeals Tribunal exclusion of Piquet or Rosberg from Brazil."
  pre_race: "Immediately before the scheduled race start of the 1982 United States Grand Prix West at Long Beach, California, Sunday 4 April 1982. Best available start marker: approximately 13:05 local time (PDT) as reported in Motor Sport May 1982; exact official programme clock not independently verified. Includes completed Friday–Saturday sessions, warm-up, confirmed grid, and pre-start conditions. Does not include the race start, race events or results, post-race protests (including Ferrari wing), or the later FISA Appeals Tribunal exclusion of Piquet or Rosberg from Brazil."
  post_race: "End of the immediate official post-race process at Long Beach: chequered flag and on-the-road finishing order of Sunday 4 April 1982; podium; lodging of post-race protests; and the race officials' Monday 5 April 1982 private session decision disqualifying Villeneuve for the twin rear wing (publicly announced by race director Chris Pook after about 12 hours), together with disallowance of Ferrari's protest against McLaren/Lauda and the recorded fine of de Angelis/Lotus, with those matters under appeal. Does not include later appeal rulings, the FISA Appeals Tribunal exclusion of Piquet or Rosberg from Brazil (about 19–20 April 1982), or San Marino weekend session or race results."
immediate_official_post_race_process: "Sunday 4 April 1982: race completion (75½ laps), on-the-road classification and podium, then-known retirement causes, lodging of Tyrrell protest (twin-wing) and Ferrari protest (McLaren/Lauda). Monday 5 April 1982: race officials' private session upholds Tyrrell protest (Villeneuve DSQ), disallows Ferrari protest, records de Angelis/Lotus fine; public announcement by Chris Pook after about 12 hours (UPI 6 April 1982). Appeals of protests and fine remain open. Boundary ends at that public announcement; excludes later appeal outcomes and the later FISA Brazil exclusions."
