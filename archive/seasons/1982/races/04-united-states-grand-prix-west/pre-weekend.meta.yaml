event_time: "Okres przedweekendowy Grand Prix Stanów Zjednoczonych Zachód w Long Beach, Kalifornia, wokół niedzieli 4 kwietnia 1982; przed pierwszą oficjalną sesją weekendu"
public_knowledge_time: "Najpóźniejsze wykorzystane źródła przed sesjami: stan po GP Brazylii 21 marca 1982 (klasyfikacja prowizoryczna, protest/stewardzi); marcowy Motor Sport (Formula One Scene / Transvaal / Notes — publication_date dnia unknown; content-based availability); kwietniowy Motor Sport (relacja z Brazylii — kontekst sporu o masę); majowy Motor Sport (pasaże o przyjeździe do Long Beach, emeryturze Reutemanna, Andrettim, przebudowie toru i planowanej procedurze — izolowane od wyników sesji; publication_date dnia unknown)"
knowledge_cutoff: "Immediately before the first official session of the 1982 United States Grand Prix West weekend on the Long Beach street circuit, California (race day Sunday 4 April 1982). Best available marker for that session start: Friday 2 April 1982 morning official test session around 10:00 local time as reported in Motor Sport May 1982; exact official programme clock not independently verified. After the Brazilian GP of 21 March 1982 and the open ASN appeal path on the water/weight protest; before any official practice, qualifying, grid, or race result from Long Beach. Does not include the later FISA Appeals Tribunal exclusion of Piquet or Rosberg from Brazil (publicly tied to circa 19–20 April 1982)."
