event_time: "Wyścig Grand Prix Stanów Zjednoczonych Zachód w Long Beach, niedziela 4 kwietnia 1982, oraz natychmiastowa procedura oficjalna do ogłoszenia decyzji o DSQ Villeneuve’a (poniedziałek 5 kwietnia 1982)"
public_knowledge_time: "Najpóźniejsze wykorzystane informacje: ogłoszenie przez Chrisa Pooka decyzji organizatorów o wykluczeniu Villeneuve’a (UPI 6 kwietnia 1982 opisuje posiedzenie w poniedziałek rano i ≈12 h opóźnienia ogłoszenia); relacje Motor Sport May 1982 i Autosport Grand Prix Gold (pasaże wyścigu/protestów; publication_date dnia unknown; content-based availability)"
knowledge_cutoff: "End of the immediate official post-race process at Long Beach: chequered flag and on-the-road finishing order of Sunday 4 April 1982; podium; lodging of post-race protests; and the race officials' Monday 5 April 1982 private session decision disqualifying Villeneuve for the twin rear wing (publicly announced by race director Chris Pook after about 12 hours), together with disallowance of Ferrari's protest against McLaren/Lauda and the recorded fine of de Angelis/Lotus, with those matters under appeal. Does not include later appeal rulings, the FISA Appeals Tribunal exclusion of Piquet or Rosberg from Brazil (about 19–20 April 1982), or San Marino weekend session or race results."
