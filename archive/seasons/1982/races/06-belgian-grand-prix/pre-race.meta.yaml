event_time: "Oficjalne sesje treningowe i kwalifikacyjne Grand Prix Belgii 1982 na Circuit Zolder (piątek 7–sobota 8 maja) oraz niedzielny poranek 9 maja 1982 do chwili bezpośrednio przed planowanym startem wyścigu"
public_knowledge_time: "Najpóźniejsze wykorzystane informacje: niedzielna rozgrzewka (~11:45 / południe), warunki pogodowe przed planowanym startem ≈15:30 lokalnie 9 maja 1982 oraz potwierdzone wycofanie Ferrari / zamknięcie pola — według Motor Sport June 1982, Autosport Grand Prix Gold (pasaże przedstartowe; publication_date dnia unknown dla reprintu; content-based availability) i UPI 9 maja 1982 (śmierć Villeneuve’a sobotnią nocą, wycofanie Ferrari); czasy pola z rekonstrukcji Racing Sports Cars"
knowledge_cutoff: "Immediately before the scheduled race start of the 1982 Belgian Grand Prix at Circuit Zolder, Sunday 9 May 1982. Best available start marker: approximately 15:30 local time as reported in Motor Sport June 1982 (“start was due at 3.30 p.m.”) and Autosport (“At 3.30 they were on their way”); Belgian afternoon CEST/UTC+2 assumed; exact official programme clock and named time zone not independently verified. Includes completed Friday Concorde sort and practice/qualifying, Saturday sessions, Villeneuve’s fatal qualifying accident and Saturday-evening death announcement, Ferrari withdrawal and Sunday grid close-up (Mass/Baldi promoted), Sunday morning warm-up, confirmed DNS/DNQ/DNPQ, and pre-start weather/tyre notes. Does not include the green-light start, formation/parade-lap incidents after cars leave for the parade, race events or results, post-race weighing/DSQs, later appeals, or season retrospectives."
spoiler_scope:
  allowed:
