  post_race: "End of the immediate official post-race process at Jacarepaguá on Sunday 21 March 1982: chequered flag, provisional finishing order and podium (including Piquet's collapse), then-known retirement causes, and the same-day Ferrari/Renault protest against the first two cars together with the stewards of the meeting's rejection of that protest and referral to the Brazilian ASN (presumed further appeal path). Does not include any subsequent ASN, FISA, or FIA Court of Appeal exclusion of Piquet or Rosberg, any reclassification awarding victory to Prost, Long Beach weekend developments, or later championship arithmetic based on a DSQ"
immediate_official_post_race_process: "Included: race completion (63 laps), provisional finishing order as published in contemporary reports, podium ceremony and Piquet collapse/revival, then-known retirement causes, Ferrari (Piccinini) and Renault (Sage) protest of cars finishing 1–2, stewards of the meeting rejection of that protest, and referral onward to the Brazilian ASN / presumed Paris path as an open process. Excluded: later ASN/FISA/FIA exclusion of Piquet or Rosberg; reclassification with Prost as winner; any appeal tribunal confirmation; next championship round."
