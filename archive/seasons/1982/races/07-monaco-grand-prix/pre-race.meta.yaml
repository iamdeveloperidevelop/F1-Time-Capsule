knowledge_cutoff: "Immediately before the scheduled race start of the 1982 Monaco Grand Prix at Monte Carlo, Sunday 23 May 1982. Best available start marker: approximately 15:30 local time as reported in Motor Sport July 1982 (“start was due at 3.30 p.m.”) and Racing Sports Cars race page (Start time: 15:30); Monaco afternoon CEST/UTC+2 assumed; exact official programme clock and named time zone not independently verified. Includes completed Thursday pre-qualifying/elimination and practice/qualifying, Friday F1 rest day, Saturday sessions, Surer ballast fine, confirmed DNQ/DNPQ, Sunday morning warm-up, and pre-start weather/tyre notes. Does not include the green-light start, parade/formation-lap incidents after cars leave for the parade, race events or results, post-race procedures, later appeals, or season retrospectives."
