knowledge_cutoff: "Immediately before the scheduled race start of the 1982 French Grand Prix, Circuit Paul Ricard (Le Castellet), Sunday 25 July 1982, local time (CEST). Best contemporary clock anchor: Autosport/Roebuck reports the green light at approximately 13:30 local; secondary compilations (e.g. prostfan) list 14:00 — exact official programme clock not independently verified. Includes completed Friday/Saturday practice and qualifying, Sunday warm-up (~30 min), confirmed grid/DNQ, publicly known pre-start setup/reliability/tyre/strategy notes, weather/track before lights, abort-start procedure and 52→54 lap amendment, and contemporary quotes. Excludes green lights and all formation-lap/race events after that boundary (including Mass–Baldi Signes accident, Arnoux/Prost team-orders outcome, race classification, later protests/appeals, Hockenheim foreshadowing)."
